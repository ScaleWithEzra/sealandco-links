<!doctype html>
<html lang="en">
<meta charset="utf-8">
<style>
  @font-face{font-family:Fraunces;src:url('../assets/fonts/Fraunces-Variable.ttf') format('truetype');font-weight:100 900}
  @font-face{font-family:Manrope;src:url('../assets/fonts/Manrope-Latin-Variable.woff2') format('woff2');font-weight:200 800}
  *{box-sizing:border-box}
  html,body{margin:0;background:transparent}
  .share-card{position:relative;width:1200px;height:630px;overflow:hidden;color:#fff0dc;background:radial-gradient(ellipse at 84% 20%,#754058 0%,#5b2d45 39%,#351728 100%)}
  .share-card:before{content:'';position:absolute;inset:0;background:url('../assets/pile.png') center/240px;mix-blend-mode:soft-light;opacity:.27}
  .share-card:after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,#35172888 0%,transparent 58%);pointer-events:none}
  .share-copy{position:absolute;z-index:2;left:80px;top:207px}
  h1{font:550 96px/1.05 Fraunces,Georgia,serif;font-variation-settings:"opsz" 72,"SOFT" 65,"WONK" 1;letter-spacing:-.035em;margin:0;text-shadow:0 4px 12px #240b1e55}
  .role{font:500 30px/1.3 Manrope,sans-serif;color:#eed8d7;margin:18px 0 0}
  .url{position:absolute;z-index:2;left:84px;bottom:53px;font:600 20px/1.3 Manrope,sans-serif;color:#f3dcd9}
  .share-flower{position:absolute;z-index:1;width:590px;height:590px;object-fit:contain;right:-4px;top:8px;filter:drop-shadow(0 25px 34px #1e0a18a8)}
  .app-icon{position:relative;width:512px;height:512px;overflow:hidden;border-radius:20%;background:radial-gradient(circle at 34% 21%,#713c55,#482038 66%,#331626)}
  .app-icon:before{content:'';position:absolute;inset:0;background:url('../assets/pile.png') center/38%;mix-blend-mode:soft-light;opacity:.25}
  .app-icon img{display:block;position:absolute;inset:5%;width:90%;height:90%;object-fit:contain;filter:drop-shadow(0 5px 9px #1d091b77)}
</style>
<div class="share-card">
  <div class="share-copy"><h1>Ezra Seal</h1><p class="role">Product design · 0→1</p></div>
  <div class="url">links.sealandco.studio</div>
  <img class="share-flower" src="../assets/flower-cutout.png" alt="">
</div>
<div class="app-icon"><img src="../assets/flower-cutout.png" alt=""></div>
</html>
